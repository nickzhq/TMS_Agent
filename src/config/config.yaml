# Application configuration
# Sensitive values use env vars ${...} (see .env.example); this file is committable (no plaintext secrets)

llm:
  base_url: ${LLM_BASE_URL}     # OpenAI-compatible chat endpoint (provider-switchable)
  api_key:  ${LLM_API_KEY}
  model:    ${LLM_MODEL}
  # mem0 embedder: a SEPARATE OpenAI-compatible endpoint (the chat MaaS endpoint serves no /embeddings).
  # Empty base_url/api_key fall back to the chat endpoint above.
  embedding_base_url: ${EMBEDDING_BASE_URL}   # e.g. https://dashscope.aliyuncs.com/compatible-mode/v1
  embedding_api_key:  ${EMBEDDING_API_KEY}    # separate key (the chat MaaS key 401s on DashScope)
  embedding_model:    ${EMBEDDING_MODEL}      # e.g. text-embedding-v4; verify via tests/test_p7_embedding
  # 视觉（发票税率识别）**默认用主模型**（上面的 model + base_url + api_key）；
  # 实测主模型可直接吃图、与专用 VL 模型逐张比对 26/26 一致（2026-10-28）。
  # 仅当主模型突然不支持图片时才加下面三个键显式覆盖（值建议写 ${VISION_*} 并在 .env 里给值）：
  #   vision_model:    ${VISION_MODEL}
  #   vision_base_url: ${VISION_BASE_URL}
  #   vision_api_key:  ${VISION_API_KEY}

db:                             # pyodbc direct connection (read-only account, credentials via env vars)
  connection_string: ${MSSQL_CONNECTION_STRING}   # preferred: full string (expanded from .env; real value only in .env, never written here)
  host:     ${MSSQL_HOST}       # fallback: separate fields (used when connection_string is empty; host must include port)
  database: ${MSSQL_DB}
  user:     ${MSSQL_USER}
  password: ${MSSQL_PASSWORD}

amap:
  api_key:  ${AMAP_MAPS_API_KEY}

memory:
  enabled: true                 # mem0 ON: embedder + add/search + restart persistence verified (P7-6/7/8); conversation call-sites wired in batch 2 (Chainlit lifecycle)
  provider: mem0
  vector_store:                 # Qdrant: local (embedded, path/on_disk) or server (host/port, Docker)
    provider: qdrant
    mode: ${QDRANT_MODE}        # local (default dev) | server (multi-process/multi-user; Docker). Empty -> local.
    path: data/qdrant           # local mode: STABLE in-project dir (NOT /tmp: mem0's default is wiped on every start)
    on_disk: true               # local mode
    host: localhost             # server mode
    port: 6333                  # server mode
    collection_name: user_preferences
    embedding_model_dims: 1024  # MUST equal the embedding model's real output dims
  history_db_path: data/mem0_history.db   # mem0 local SQLite history (default ~/.mem0/history.db)

knowledge_base:
  enabled: false                # WeKnora disabled by default (wired but off); set true once deployed
  provider: weknora
  url: ${WEKNORA_URL}

persistence:                    # web layer: checkpointer + sessions + auth store
  provider: ${PERSISTENCE_PROVIDER}       # sqlite (dev/tests, files under data/) | postgres (multi-user). Empty -> sqlite.
  checkpointer_path: data/langgraph.db    # sqlite mode only
  sessions_db_path: data/sessions.db      # sqlite mode only

postgres:                       # Postgres (P8 batch-2; used when persistence.provider=postgres)
  dsn: ${POSTGRES_DSN}          # e.g. postgresql://estimate:your-pg-password@localhost:5432/estimate
  pool_min: 1
  pool_max: 20

api:                            # FastAPI backend (P8 front/back split): bind address + CORS
  host: 127.0.0.1
  port: 8000
  cors_origins: ["*"]           # restrict to the frontend origin in production

auth:                           # real auth (P8): JWT + password-hashed user store (replaces the mock login)
  jwt_secret: ${AUTH_JWT_SECRET}   # REQUIRED from env; generate: python -c "import secrets; print(secrets.token_urlsafe(48))"
  jwt_algorithm: HS256
  jwt_expire_minutes: 720       # 12h
  user_db_path: data/auth.db    # SQLite for batch-1 (-> Postgres later)
  allow_registration: false     # keep off; create users via `python -m src.auth.cli create-user`

backend:                        # where the Chainlit frontend reaches the backend
  base_url: http://127.0.0.1:8000
  ws_url: ws://127.0.0.1:8000

bill:                           # Bill Agent: monthly invoice output location + asset paths
  # Output root of a billing package (user/shipper/period three levels). Empty -> default folder on the user's desktop
  output_root: ${BILL_OUTPUT_ROOT}
  output_user: ${BILL_OUTPUT_USER}  # empty -> ai_gen (CLI placeholder folder; web passes the login name)
  run_dir: data/bill_run         # staging dir (written first, then moved as a whole to output_root)
  templates_dir: ""              # empty -> agents/bill/templates
  shippers_file: ""              # empty -> agents/bill/shippers.yaml
  logo_path: ""                 # empty -> agents/bill/assets/logo.png
  prior_ledger: ""               # empty -> data/_xls_dump.txt (prior-period baseline used by part-3 deduction)
  build_vouchers: true         # also generate the per-B/L voucher collection (many PDFs; can be turned off)
  # Billing ledger: every run is recorded and provides the prior-period baseline for part-3 deduction.
  ledger_db: ${BILL_LEDGER_DB}          # empty -> data/bill_ledger.db (sqlite file, used by the sqlite backend only)
  ledger_provider: ${BILL_LEDGER_PROVIDER}   # empty -> postgres; sqlite for a local file
  ledger_dsn: ${BILL_LEDGER_DSN}        # empty -> POSTGRES_DSN env var (postgres backend only)
  ledger_schema: ${BILL_LEDGER_SCHEMA}  # empty -> bill; postgres schema that isolates the ledger tables
